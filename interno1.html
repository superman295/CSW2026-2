<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos internos com CSS - Página 1</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em;
            color: blue;
            background-color: lightgray;
        }
        h1 {
            font-size: 2em;
            color: black;
        }
        h2 {
            color: brown;
        }
    </style>
</head>
<body>

    <h1>Capítulo 1</h1>

    <h2>Capítulo 1.1</h2>
    <p>No CSS interno, o estilo fica dentro da tag style, no head da página.</p>

    <h2>Capítulo 1.2</h2>
    <p>Assim, a regra vale para todas as tags iguais da página.</p>

    <h1>Capítulo 2</h1>

    <h2>Capítulo 2.1</h2>
    <p>Para mudar a cor dos h2, mudo só em um lugar, mas só nesta página.</p>

    <p><a href="index.html">&lt;&lt; voltar para o índice</a></p>

</body>
</html>
