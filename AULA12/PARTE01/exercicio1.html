<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 - Contêiner flexbox</title>
    <style>
        /* O container vira flexbox com display: flex */
        .container {
            display: flex;
            background-color: lightgray;
            padding: 10px;
        }

        .item {
            background-color: tomato;
            color: white;
            width: 100px;
            height: 100px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Exercício 1</h1>
    <p>Contêiner flexbox simples usando display: flex.</p>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <p><a href="index.html">&lt;&lt; voltar para o índice</a></p>

</body>
</html>
