<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 08 - Áudio e Vídeo</title>
</head>
<body>

    <h1>Aula 08 - Apresentação de Áudio e Vídeo</h1>

    <hr>

    <h2>A) Vídeo local</h2>

    <video width="600" style="max-width: 100%;" poster="midia/video/thumb.jpg" controls>
        <source src="midia/video/uvv_tubarao_2013.mp4" type="video/mp4">
        <p>Seu navegador não suporta vídeo.
        <a href="midia/video/uvv_tubarao_2013.mp4" download="uvv_tubarao_2013.mp4">Clique aqui para baixar</a></p>
    </video>

    <hr>

    <h2>B) Áudio local</h2>

    <audio preload="metadata" controls>
        <source src="midia/audio/musica.mp3" type="audio/mpeg">
        <p>Seu navegador não suporta áudio.
        <a href="midia/audio/musica.mp3" download="musica.mp3" type="audio/mpeg">Clique aqui para baixar</a></p>
    </audio>

    <hr>

    <h2>C) Vídeo do YouTube</h2>

    <p>
        <a href="pagina/videoyoutube.html">
            <img src="img/youtube.png" alt="Logo do YouTube" width="150">
        </a>
    </p>

    <h2>D) Vídeo do Vimeo</h2>

    <p>
        <a href="pagina/videovimeo.html">
            <img src="img/vimeo.png" alt="Logo do Vimeo" width="150">
        </a>
    </p>

</body>
</html>
